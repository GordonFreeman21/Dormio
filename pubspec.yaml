name: dormio
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Audio
  record: ^5.0.4
  just_audio: ^0.9.36
  fftea: ^1.2.0
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Calendar Integration
  device_calendar: ^4.3.2
  # Notifications & Background
  flutter_local_notifications: ^16.3.0
  workmanager: ^0.5.2
  timezone: ^0.9.2
  # Charts & Visuals
  fl_chart: ^0.66.2
  # Permissions
  permission_handler: ^11.3.0
  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  # UI
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  go_router: ^13.0.0
  cupertino_icons: ^1.0.6
  wakelock_plus: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
